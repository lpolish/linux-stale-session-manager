name: Verify Checksums

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Verify checksums
        run: |
          echo "Current checksum:"
          sha256sum linux-stale-session-manager.sh
          echo "Expected checksum:"
          grep "linux-stale-session-manager.sh" checksums.txt || echo "No checksum found"

          sha256sum -c checksums.txt --ignore-missing
